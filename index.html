<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarnol Filling Station ERP</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#10252b"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M20 14h18v36H20zM38 24h6l4 6v16a3 3 0 0 1-6 0V34' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
</head><body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card login-card">
    <h1>⛽ Tarnol Filling Station</h1><p class="muted">ERP sign in</p>
    <label>Email<input id="lEmail" type="email" required autocomplete="username"></label>
    <label>Password<input id="lPass" type="password" required autocomplete="current-password"></label>
    <button class="btn primary" type="submit">Sign in</button><p id="lErr" class="err"></p>
  </form>
</div>
<div id="app" class="hidden">
  <header class="topbar"><button id="menuBtn" class="btn ghost" aria-label="Menu">☰</button><b id="stationName">Tarnol Filling Station</b><span id="demoTag" class="tag warn hidden">DEMO – local only</span><span class="grow"></span><span id="syncTag" class="tag">…</span><button id="logoutBtn" class="btn ghost">Sign out</button></header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div id="toast"></div>
<script src="js/firebase-config.js"></script>
<script src="js/app.bundle.js"></script>
</body></html>
